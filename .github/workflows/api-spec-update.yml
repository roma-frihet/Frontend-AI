name: API Spec Update

# 백엔드 CI가 새 스펙을 올린 뒤 repository_dispatch(type: api-spec-updated, payload: version)를 보내면 실행된다.
on:
  repository_dispatch:
    types: [api-spec-updated]
  workflow_dispatch:
    inputs:
      version:
        description: "연동할 스펙 버전 (예: 1.4.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPEC_VERSION: ${{ github.event.client_payload.version || inputs.version }}
      API_SPEC_BASE_URL: ${{ secrets.API_SPEC_BASE_URL }}
      API_SPEC_TOKEN: ${{ secrets.API_SPEC_TOKEN }}
    steps:
      - name: 버전 검증
        run: |
          if [[ ! "$SPEC_VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::유효하지 않은 버전입니다: '$SPEC_VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: api-spec.version 갱신
        run: echo "$SPEC_VERSION" > api-spec.version

      # pull/gen은 실패하면 워크플로를 중단한다 (스펙 자체가 없으면 PR을 만들 의미가 없음).
      - name: api:pull
        run: npm run api:pull

      - name: api:gen
        run: npm run api:gen

      # typecheck 실패는 PR 생성을 막지 않고, PR 본문에 표시한다.
      - name: typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: PR 본문 작성
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          if [ "$TYPECHECK_OUTCOME" = "success" ]; then
            STATUS="✅ typecheck 통과"
          else
            STATUS="❌ **typecheck 실패** — 새 스펙으로 인해 기존 코드가 깨졌습니다. 머지 전에 수정이 필요합니다. (Actions 로그 확인)"
          fi
          {
            echo "백엔드 API 스펙 버전 \`$SPEC_VERSION\`(으)로 갱신합니다."
            echo
            echo "- 변경: \`api-spec.version\`, \`api/openapi.json\`, \`src/api/generated\`"
            echo "- $STATUS"
            echo "- 실행: [워크플로 로그]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > "$RUNNER_TEMP/pr-body.md"

      - uses: peter-evans/create-pull-request@v7
        with:
          # 기본 GITHUB_TOKEN으로 만든 PR은 CI가 자동 실행되지 않는다. 필요하면 PAT를 PR_TOKEN으로 등록한다.
          token: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: api-spec/${{ env.SPEC_VERSION }}
          base: main
          commit-message: "chore(api): 스펙 ${{ env.SPEC_VERSION }} 반영"
          title: "chore(api): 스펙 ${{ env.SPEC_VERSION }} 반영"
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: |
            api-spec.version
            api/openapi.json
            src/api/generated
          delete-branch: true
